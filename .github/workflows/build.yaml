name: build
on:
  push: 
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: code checkout
        uses: actions/checkout@v7
      - name: build image
        run: docker build -t go-image .
      - name: verify image
        run: |
          docker images
          echo ${{ secrets.DOCKER_USERNAME }}
      - name: tag image
        run: docker image tag go-image:latest ${{ secrets.DOCKER_USERNAME }}/go-image:latest
      - name: push image to dockerhub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
        
      
          
          
