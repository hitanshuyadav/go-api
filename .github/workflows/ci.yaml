name: ci
on: 
  push: 
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: code checkout
        uses: actions/checkout@v7
      - name: setup go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Download dependencies
        run: go mod download
      - name: Run tests
        run: go test .
      - name: Run vet
        run: go vet .

      - name: Build application
        run: go build .
        
        
        
    
