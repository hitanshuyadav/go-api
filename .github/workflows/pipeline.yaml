name: CI-pipeline
on: 
  push:
    branches: ["master"]
  pull_request:
   branches: ["master"]
jobs:
  ci:
    uses: ./.github/workflows/ci.yaml
  security:
    uses: ./.github/workflows/security.yaml
  build:
    needs: [ci, security]
    uses: ./.github/workflows/build.yaml
  push:
    needs: [build]
    uses: ./.github/workflows/push.yaml
